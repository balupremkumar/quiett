<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Quiett icon candidate 1 "Fade": a 3-bar waveform stepping down to near-silence,
       left to right. Reads the product's core job (speech in, quiet clean text out)
       at a glance; three thick pill bars hold their shape all the way down to 16px. -->
  <defs>
    <linearGradient id="qgrad-fade-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFA8FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#0B0D13"/>
  <rect x="51" y="50" width="34" height="140" rx="17" fill="url(#qgrad-fade-v)"/>
  <rect x="111" y="100" width="34" height="90" rx="17" fill="url(#qgrad-fade-v)"/>
  <rect x="171" y="144" width="34" height="46" rx="17" fill="url(#qgrad-fade-v)"/>
</svg>
